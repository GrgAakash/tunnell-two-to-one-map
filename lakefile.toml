name = "RequestProject"
defaultTargets = ["RequestProject", "TunnellMap", "PalomarEntries"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

[[lean_lib]]
name = "RequestProject"
globs = ["RequestProject.+"]

[[lean_lib]]
name = "TunnellMap"

[[lean_lib]]
name = "PalomarEntries"
roots = [
  "Challenge",
  "Solution",
  "Palomar.EntryB.Challenge",
  "Palomar.EntryB.Solution",
  "Palomar.AxiomAudit",
]
